name: CI/CD

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check public/app.js
      - run: node --test tests/app.test.js

  ci-cd:
    needs: static-checks
    uses: josephdodge8141/auto-pr/.github/workflows/ci-cd-pipeline.yml@74b5105cac5cfb6614e0fc59b4c39eb8899df689
    secrets: inherit
