<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Joe's workspace.">
  <title>Joe's Workspace</title>
</head>
<body>
  <main>
    <header>
      <h1 style="text-align: center">Joe's Workspace</h1>
    </header>

    <form id="filters">
      <p>
        <label for="search">Search</label>
        <input id="search" name="search" type="search" autocomplete="off">
        <span role="group" aria-labelledby="tags-label">
          <strong id="tags-label">Tags</strong>
          <span id="tags"></span>
        </span>
        <span role="group" aria-labelledby="dates-label">
          <strong id="dates-label">Date range</strong>
          <label for="from">From</label>
          <input id="from" name="from" type="date">
          <label for="to">To</label>
          <input id="to" name="to" type="date">
        </span>
        <button type="reset">Clear filters</button>
      </p>
    </form>

    <p>
      <button id="expand" type="button">Expand all</button>
      <button id="collapse" type="button">Collapse all</button>
    </p>

    <p id="status" role="status" aria-live="polite">Loading ideas.</p>
    <section id="ideas" aria-label="Ideas"></section>

    <noscript><p>JavaScript is required to load and search the ideas.</p></noscript>
  </main>

  <script src="app.js"></script>
</body>
</html>
